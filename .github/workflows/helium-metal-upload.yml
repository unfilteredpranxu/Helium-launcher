name: Helium Metal Upload Validation
on:
  push:
    branches: [feature/helium-g05-metal-upload, feature/helium-g05-async-upload, feature/helium-g05-async-draw, feature/helium-g05-metal-presentation, feature/helium-g06-real-world-metal, feature/helium-g06-production-banks, feature/helium-g06-attached-game, feature/helium-g06d-one-build-diagnostics, feature/helium-g07-immutable-capture]
    paths:
      - 'crates/horizon-metal-bridge/**'
      - 'crates/helium-render-scene/**'
      - 'crates/horizon-client-render/src/gfx/material_snapshot.rs'
      - 'crates/horizon-client/src/game.rs'
      - 'crates/horizon-client-render/src/gfx.rs'
      - 'crates/horizon-client/src/game/**'
      - 'crates/horizon-client/tests/generation_saves.rs'
      - 'crates/horizon-client/src/entry.rs'
      - 'crates/horizon-client/src/save.rs'
      - 'crates/horizon-client/src/save/**'
      - 'crates/horizon-client/src/lan/playerdata.rs'
      - 'crates/horizon-client/src/game/saving.rs'
      - 'crates/horizon-client/src/game/integrated.rs'
      - 'crates/horizon-threads/src/**'
      - 'crates/horizon-ios-launcher/**'
      - 'third_party/winit/src/platform_impl/macos/**'
      - 'third_party/winit/src/platform/macos.rs'
      - 'third_party/winit/src/platform/ios.rs'
      - 'third_party/winit/src/platform_impl/ios/**'
      - 'crates/horizon-client-render/src/hud.rs'
      - 'crates/horizon-client-render/src/hud_layout.rs'
      - 'crates/horizon-client/src/menu.rs'
      - 'crates/horizon-client-render/src/lod.rs'
      - 'crates/horizon-client-render/src/streaming.rs'
      - 'crates/horizon-client/src/game/remote.rs'
      - 'crates/horizon-client-render/src/gfx/material_snapshot/**'
      - 'packaging/ios/Launcher/**'
      - 'packaging/ios/project.yml'
      - 'packaging/ios/GameInfo.plist'
      - 'tools/ci/verify-attached-ios-game.py'
      - 'tools/ci/ios_package.py'
      - 'tests/test_helium_ios_package.py'
      - 'tests/test_attached_ios_binary.py'
      - 'tools/ci/MetalDiag*'
      - 'crates/horizon-client/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'experiments/metal-prototype/src/**'
      - 'experiments/metal-prototype/ios/**'
      - 'experiments/metal-prototype/helium_metal_prototype.h'
      - 'experiments/metal-prototype/tools/**'
      - 'experiments/metal-prototype/examples/**'
      - 'experiments/metal-prototype/Cargo.toml'
      - 'experiments/metal-prototype/Cargo.lock'
      - '.github/workflows/helium-metal-upload.yml'
  workflow_dispatch:
    inputs:
      publish_no_world_probe:
        description: Publish a standalone no-world probe for separate host qualification
        type: boolean
        default: false
      publish_owner_ipa:
        description: Publish the single owner IPA only after qualification
        type: boolean
        default: false
concurrency:
  group: helium-metal-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
jobs:
  apple-sdk:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record actual Apple tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helium-upload"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk macosx --show-sdk-version
          } 2>&1 | tee "$RUNNER_TEMP/helium-upload/toolchain.log"
      - name: Install pinned Rust and iOS target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: Compile and link experimental macOS tests
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/macos-tests.log"
      - name: Compile experimental iOS library and tests
        run: |
          set -euo pipefail
          cargo +1.95.0 check --locked --tests --target aarch64-apple-ios \
            --manifest-path experiments/metal-prototype/Cargo.toml \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/ios-check.log"
      - name: Compile existing G01 and G02 Metal shaders
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          {
            xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c \
              experiments/metal-prototype/src/terrain.metal -o "$RUNNER_TEMP/helium-upload/g01.air"
            xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c \
              experiments/metal-prototype/src/terrain/terrain24.metal -o "$RUNNER_TEMP/helium-upload/g02.air"
            xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c \
              experiments/metal-prototype/src/terrain/metal/hud.metal -o "$RUNNER_TEMP/helium-upload/hud.air"
          } 2>&1 | tee "$RUNNER_TEMP/helium-upload/msl.log"
      - name: Compile banked terrain entry for iOS15
        run: |
          cat experiments/metal-prototype/src/terrain/terrain24.metal experiments/metal-prototype/src/terrain/terrain_banked.metal > "$RUNNER_TEMP/banked.metal"
          xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c "$RUNNER_TEMP/banked.metal" -o "$RUNNER_TEMP/helium-upload/banked.air"
      - name: Compile presentation shader and unsigned probe host
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c experiments/metal-prototype/src/terrain/metal/presentation.metal -o "$RUNNER_TEMP/helium-upload/display.air"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd experiments/metal-prototype/ios && xcodegen generate)
          env -u MACOSX_DEPLOYMENT_TARGET xcodebuild -project experiments/metal-prototype/ios/HeliumMetalProbe.xcodeproj -scheme HeliumMetalProbe -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/helium-probe-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= HELIUM_DIAGNOSTIC_SHA="$GITHUB_SHA" build > "$RUNNER_TEMP/helium-upload/swift-host.log" 2>&1 || { tail -100 "$RUNNER_TEMP/helium-upload/swift-host.log"; exit 1; }
      - name: Probe native Metal uploads and original G01/G02 GPU regressions
        id: gpu
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/native-runtime.log"
      - name: Run the standalone native scene and audit the iOS executable
        run: |
          set -euo pipefail
          manifest=experiments/metal-prototype/Cargo.toml
          host=$(rustc +1.95.0 -vV | sed -n 's/^host: //p')
          {
            for target in "$host" aarch64-apple-ios; do
              echo "Native-only build dependencies for $target"
              dependencies="$RUNNER_TEMP/helium-upload/scene-$target.tree"
              cargo +1.95.0 tree --locked --manifest-path "$manifest" --target "$target" --edges normal,build --prefix none --format '{p}' | sort -u | tee "$dependencies"
              if grep -E '^(wgpu|naga |horizon-)' "$dependencies"; then
                echo "Unexpected graphics or gameplay dependency" >&2
                exit 1
              fi
            done
            cargo +1.95.0 run --locked --manifest-path "$manifest" --example native_scene
            cargo +1.95.0 build --locked --manifest-path "$manifest" --target aarch64-apple-ios --release --example native_scene
            binary=experiments/metal-prototype/target/aarch64-apple-ios/release/examples/native_scene
            python3 - "$binary" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/ci")
          from ios_package import inspect_mach
          inspect_mach(Path(sys.argv[1]), 2)
          print("Verified thin arm64 device iOS 15.0 executable and entry point")
          PY
            xcrun otool -L "$binary" | tee "$RUNNER_TEMP/scene-libraries.txt"
            xcrun nm -a "$binary" > "$RUNNER_TEMP/scene-symbols.txt"
            if grep -Ei 'wgpu|webgpu|vulkan|/OpenGLES?\.framework|/JavaVM\.framework' "$RUNNER_TEMP/scene-symbols.txt" "$RUNNER_TEMP/scene-libraries.txt"; then
              echo "Unexpected graphics runtime linkage" >&2
              exit 1
            fi
            grep -q '_MTLCreateSystemDefaultDevice' "$RUNNER_TEMP/scene-symbols.txt"
            shasum -a 256 "$binary"
            echo "LINKED_WGPU_DEPENDENCIES=0 NATIVE_IOS_ARM64_LINK=PASS"
          } 2>&1 | tee "$RUNNER_TEMP/helium-upload/native-scene.log"
      - name: Verify final unsigned no-world probe IPA
        if: github.ref == 'refs/heads/feature/helium-g07-immutable-capture'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owner-probe"
          app="$RUNNER_TEMP/helium-probe-build/Build/Products/Release-iphoneos/HeliumMetalProbe.app"
          cargo +1.95.0 tree --locked --target aarch64-apple-ios --manifest-path experiments/metal-prototype/Cargo.toml > "$RUNNER_TEMP/owner-probe/dependencies.txt"
          if grep -E '(^|[[:space:]])(horizon-|wgpu)' "$RUNNER_TEMP/owner-probe/dependencies.txt"; then exit 1; fi
          python3 tools/ci/ios_package.py probe "$app" "$RUNNER_TEMP/owner-probe/Helium-S1H-Metal-Probe-unsigned.ipa" "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/helium-upload/probe-package.log"
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_no_world_probe && github.ref == 'refs/heads/feature/helium-g07-immutable-capture'
        with:
          name: Helium-S1H-no-world-probe-unsigned
          path: |
            ${{ runner.temp }}/owner-probe/Helium-S1H-Metal-Probe-unsigned.ipa
            ${{ runner.temp }}/owner-probe/dependencies.txt
            ${{ runner.temp }}/helium-upload/probe-package.log
          if-no-files-found: error
      - name: Report separate runtime outcome
        if: always()
        env:
          GPU_OUTCOME: ${{ steps.gpu.outcome }}
        run: |
          echo "Native Metal runtime step: $GPU_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Only a successful runtime test proves this runner executed Metal; SDK compilation alone does not." >> "$GITHUB_STEP_SUMMARY"
          echo "The no-world IPA is unsigned. Physical installation and display are unverified." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish readable evidence through the Checks API
        if: always()
        uses: actions/github-script@v7
        env:
          GPU_OUTCOME: ${{ steps.gpu.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const names = ['toolchain.log', 'macos-tests.log', 'ios-check.log', 'msl.log', 'swift-host.log', 'native-runtime.log', 'native-scene.log', 'probe-package.log'];
            const sections = names.map(name => {
              const file = path.join(process.env.RUNNER_TEMP, 'helium-upload', name);
              const data = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'NOT RUN / no log';
              return '### ' + name + '\n\n```text\n' + data.slice(-8500) + '\n```';
            });
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Helium upload evidence', status: 'completed', conclusion: 'neutral',
              output: { title: 'Observed native-runtime step: ' + process.env.GPU_OUTCOME,
                summary: sections.join('\n\n') }
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helium-metal-upload-evidence
          path: ${{ runner.temp }}/helium-upload/*.log
          if-no-files-found: warn

  production-bridge:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '3'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: Check the actual game opt-in and iOS bridge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge"
          cargo +1.95.0 test --locked -p horizon-metal-bridge 2>&1 | tee "$RUNNER_TEMP/bridge/tests.log"
          cargo +1.95.0 test --locked -p helium-render-scene hud::tests 2>&1 | tee "$RUNNER_TEMP/bridge/hud.log"
          cargo +1.95.0 test --locked -p horizon-client-render --lib gfx::tests::native_terrain 2>&1 | tee "$RUNNER_TEMP/bridge/cpu-native-input.log"
          cargo +1.95.0 test --locked -p horizon-client-render --lib hud::tests::native_atlas 2>&1 | tee "$RUNNER_TEMP/bridge/cpu-hud-atlas.log"
          cargo +1.95.0 test --locked -p horizon-client-render --lib hud_layout::tests 2>&1 | tee -a "$RUNNER_TEMP/bridge/cpu-hud-atlas.log"
          cargo +1.95.0 test --locked -p horizon-client-render --lib touch:: 2>&1 | tee -a "$RUNNER_TEMP/bridge/cpu-hud-atlas.log"
          HORIZON_SPRITE_SPLIT=512 cargo +1.95.0 test --locked -p horizon-metal-bridge --lib runtime::ownership_tests::native_worker_from_production_owned_bank_and_typed_section -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/bridge/native.log"
          cargo +1.95.0 check --locked -p horizon-client --no-default-features --features helium-native-metal-gameplay 2>&1 | tee "$RUNNER_TEMP/bridge/game.log"
          cargo +1.95.0 check --locked --target aarch64-apple-ios -p horizon-metal-bridge 2>&1 | tee "$RUNNER_TEMP/bridge/ios.log"
          cargo +1.95.0 check --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features helium-native-metal-gameplay 2>&1 | tee "$RUNNER_TEMP/bridge/ios-game.log"
      - name: Publish bridge compilation evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), path=require('path');
            const summary=['tests.log','hud.log','cpu-native-input.log','cpu-hud-atlas.log','native.log','game.log','ios.log','ios-game.log'].map(n=>{
              const p=path.join(process.env.RUNNER_TEMP,'bridge',n);
              return '### '+n+'\n```text\n'+(fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-10000):'NOT RUN')+'\n```';
            }).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'Helium production bridge evidence',status:'completed',conclusion:'neutral',output:{title:'Read individual compilation logs; not gameplay runtime proof',summary}});

  shutdown-save-qualification:
    name: G07 R3 owned shutdown and replay (publication HOLD) - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-dev libxkbcommon-dev libx11-dev libudev-dev libasound2-dev
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Controlled save durability and shutdown deadline regressions
        env:
          CARGO_BUILD_JOBS: '3'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g07r3"
          cargo +1.95.0 test --locked -p horizon-threads --lib jobs:: 2>&1 | tee "$RUNNER_TEMP/g07r3/threads.log"
          cargo +1.95.0 test --locked -p horizon-client-lib --no-default-features --lib save:: -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/g07r3/save.log"
          cargo +1.95.0 test --locked -p horizon-client-lib --no-default-features --lib lan::playerdata::tests:: 2>&1 | tee "$RUNNER_TEMP/g07r3/player.log"
          cargo +1.95.0 test --locked -p horizon-client-lib --no-default-features --lib menu::tests::native_ui_inventory 2>&1 | tee -a "$RUNNER_TEMP/g07r3/player.log"
          cargo +1.95.0 test --locked -p horizon-client --no-default-features --lib game::integrated::shutdown_tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/g07r3/game-exit.log"
          cargo +1.95.0 test --locked -p horizon-client --no-default-features --lib game::saving::shutdown_tests -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/g07r3/game-exit.log"
          cargo +1.95.0 test --locked -p horizon-client --no-default-features --lib game::runtime_exit::tests -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/g07r3/game-exit.log"
          cargo +1.95.0 test --locked -p horizon-client --no-default-features --lib game::native_ui_tests 2>&1 | tee -a "$RUNNER_TEMP/g07r3/game-exit.log"
          cargo +1.95.0 test --locked -p horizon-ios-launcher --lib 2>&1 | tee -a "$RUNNER_TEMP/g07r3/game-exit.log"
          cargo +1.95.0 test --locked -p horizon-client-render --lib streaming:: 2>&1 | tee "$RUNNER_TEMP/g07r3/streaming.log"
          rustfmt +1.95.0 --check --edition 2024 --config skip_children=true crates/horizon-client/src/save.rs crates/horizon-client/src/save/journal.rs crates/horizon-client/src/save/journal/tests.rs crates/horizon-client/src/save/shutdown.rs crates/horizon-client/src/save/shutdown/tests.rs crates/horizon-client/src/lan/playerdata.rs crates/horizon-client/src/game.rs crates/horizon-client/src/game/shutdown.rs crates/horizon-client/src/game/saving.rs crates/horizon-client/src/game/integrated.rs crates/horizon-client/src/game/integrated/shutdown_tests.rs crates/horizon-client/src/game/remote.rs crates/horizon-client/src/game/levels.rs crates/horizon-client/src/game/world_loading.rs crates/horizon-client-render/src/streaming.rs crates/horizon-client-render/src/lod.rs crates/horizon-threads/src/retirement.rs
          rustfmt +1.95.0 --check --edition 2024 --config skip_children=true crates/horizon-client/src/game/runtime_exit.rs crates/horizon-ios-launcher/src/lib.rs
      - name: Publish synthetic shutdown and real filesystem evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const summary=['threads.log','save.log','player.log','game-exit.log','streaming.log'].map(n=>{
              const p=path.join(process.env.RUNNER_TEMP,'g07r3',n);
              const s=fs.existsSync(p)?fs.readFileSync(p,'utf8').split('\n').filter(l=>/^(running |test |test result:|error[:\[]|failures:)/.test(l)).join('\n'):'NOT RUN';
              return '### '+n+'\n```text\n'+s.slice(-16000)+'\n```';
            }).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'G07 R3 shutdown evidence - '+process.env.RUNNER_OS,status:'completed',conclusion:'neutral',output:{title:'Production ownership components + synthetic temporary disk/kill/replay; NOT UIKit or hardware watchdog prevention',summary}});

  attached-ios-game:
    needs: [apple-sdk, production-bridge, diagnostics-qualification, linux-diagnostics, shutdown-save-qualification]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      RUSTUP_TOOLCHAIN: '1.95.0'
      HELIUM_DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
          mkdir -p "$RUNNER_TEMP/attached-game"
          xcodebuild -version | tee "$RUNNER_TEMP/attached-game/apple.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$RUNNER_TEMP/attached-game/apple.log"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helium-g06c-ios
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check default game and prove disabled dependency isolation
        run: |
          set -euo pipefail
          cargo +1.95.0 check --locked -p horizon-client --no-default-features 2>&1 | tee "$RUNNER_TEMP/attached-game/default.log"
          cargo +1.95.0 tree --locked -p horizon-client --no-default-features --target aarch64-apple-ios > "$RUNNER_TEMP/attached-game/default-tree.log"
          python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); assert "horizon-metal-bridge" not in s and "helium-metal-prototype" not in s; print("disabled graph excludes native bridge/backend")' "$RUNNER_TEMP/attached-game/default-tree.log" | tee "$RUNNER_TEMP/attached-game/dependency-isolation.log"
          python3 -m unittest discover -s tests -p test_attached_ios_binary.py 2>&1 | tee "$RUNNER_TEMP/attached-game/binary-guard-tests.log"
      - name: Actually link the opt-in arm64 Rust GAME executable
        run: |
          set -euo pipefail
          cargo +1.95.0 build --release --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features audio,helium-native-metal-gameplay 2>&1 | tee "$RUNNER_TEMP/attached-game/rust-link.log"
          cargo +1.95.0 tree --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features audio,helium-native-metal-gameplay -i wgpu > "$RUNNER_TEMP/attached-game/game-wgpu-graph.log"
      - name: Compile and link the actual UIKit launcher and game bundle
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd packaging/ios && xcodegen generate)
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO DEBUG_INFORMATION_FORMAT=dwarf CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/attached-game/build" build > "$RUNNER_TEMP/attached-game/xcode.log" 2>&1 || { tail -80 "$RUNNER_TEMP/attached-game/xcode.log"; exit 1; }
          app="$RUNNER_TEMP/attached-game/build/HorizonGame.app"
          python3 tools/ci/verify-attached-ios-game.py "$app" target/aarch64-apple-ios/release/horizon-client --native-gameplay 2>&1 | tee "$RUNNER_TEMP/attached-game/verified.log"
          # Inspect the exact archive and discard it. The gameplay release hold below is independent.
          trap 'rm -f "$RUNNER_TEMP/attached-game/held.ipa"' EXIT
          python3 tools/ci/ios_package.py game "$app" "$RUNNER_TEMP/attached-game/held.ipa" "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/attached-game/package-verifier.log"
      - name: Package the one qualified owner IPA
        if: github.event_name == 'workflow_dispatch' && inputs.publish_owner_ipa
        run: |
          set -euo pipefail
          echo 'P0 SHUTDOWN/SAVE HOLD: bounded durable host exit is not qualified; NO OWNER IPA.' >&2
          exit 1
      - name: Publish actual game link evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const summary=['apple.log','default.log','dependency-isolation.log','binary-guard-tests.log','rust-link.log','game-wgpu-graph.log','xcode.log','verified.log','package-verifier.log'].map(n=>{
              const p=path.join(process.env.RUNNER_TEMP,'attached-game',n);
              return '### '+n+'\n```text\n'+(fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-7500):'NOT RUN')+'\n```';
            }).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'Helium attached GAME link evidence',status:'completed',conclusion:'neutral',output:{title:'Actual game link and Swift symbols; NOT device/world runtime evidence',summary}});
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_owner_ipa
        with:
          name: Helium-G07A-historical-game-unsigned
          path: |
            ${{ runner.temp }}/attached-game/Helium-G07A-game-unsigned.ipa
            experiments/metal-prototype/docs/G07-A-owner.md
            ${{ runner.temp }}/attached-game/verified.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helium-g06c-game-link-logs
          path: ${{ runner.temp }}/attached-game/*.log

  diagnostics-qualification:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      HELIUM_DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Rust diagnostics and Swift C ABI report roundtrip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag-evidence" "$RUNNER_TEMP/diag-session"
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml flight_recorder:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/diag-evidence/tests.log"
          cargo +1.95.0 build --locked --manifest-path experiments/metal-prototype/Cargo.toml --lib
          swiftc -import-objc-header tools/ci/MetalDiagnosticsABI.h packaging/ios/Launcher/MetalDiagnosticsModel.swift tools/ci/MetalDiagnosticE2E.swift experiments/metal-prototype/target/debug/libhelium_metal_prototype.a -framework Metal -framework QuartzCore -framework Foundation -framework CoreGraphics -framework IOSurface -o "$RUNNER_TEMP/diag-e2e"
          HELIUM_DIAGNOSTIC_DIRECTORY="$RUNNER_TEMP/diag-session" "$RUNNER_TEMP/diag-e2e" 2>&1 | tee "$RUNNER_TEMP/diag-evidence/e2e.log"
          cp "$RUNNER_TEMP/diag-session/Helium-Metal-Report.txt" "$RUNNER_TEMP/diag-evidence/TEST_ONLY-report.txt"
          HELIUM_DIAGNOSTIC_DIRECTORY="$RUNNER_TEMP/diag-session" "$RUNNER_TEMP/diag-e2e" --recover 2>&1 | tee "$RUNNER_TEMP/diag-evidence/recovery.log"
      - name: Test standalone host evidence storage
        run: |
          swiftc packaging/ios/Launcher/HostEvidence.swift tools/ci/MetalHostEvidenceTest.swift -o "$RUNNER_TEMP/host-evidence-test"
          "$RUNNER_TEMP/host-evidence-test" | tee "$RUNNER_TEMP/diag-evidence/host-evidence.log"
      - name: Compile actual UIKit diagnostics host (no shell substitution)
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd packaging/ios && xcodegen generate)
          xcodebuild -project packaging/ios/HorizonIOS.xcodeproj -target HorizonLauncherKit -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/diag-framework" build > "$RUNNER_TEMP/diag-evidence/UIKit.log" 2>&1 || { tail -80 "$RUNNER_TEMP/diag-evidence/UIKit.log"; exit 1; }
      - name: Publish diagnostic qualification evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const summary=['tests.log','e2e.log','recovery.log','UIKit.log','host-evidence.log','TEST_ONLY-report.txt'].map(n=>{let p=path.join(process.env.RUNNER_TEMP,'diag-evidence',n);return '### '+n+'\n```text\n'+(fs.existsSync(p)?(n==='TEST_ONLY-report.txt'?fs.readFileSync(p,'utf8').slice(0,22000):fs.readFileSync(p,'utf8').slice(-7000)):'NOT RUN')+'\n```';}).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'Helium diagnostics E2E evidence',status:'completed',conclusion:'neutral',output:{title:'Real Swift/C/Rust/report and UIKit compile; synthetic, not physical-device evidence',summary}});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G06D-TEST-ONLY-diagnostics-evidence
          path: ${{ runner.temp }}/diag-evidence/*

  linux-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-dev libxkbcommon-dev libx11-dev libudev-dev libasound2-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Mandatory Linux regressions and formatting
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_helium_ios_package.py'
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml
          cargo +1.95.0 test --locked -p helium-render-scene
          cargo +1.95.0 test --locked -p horizon-metal-bridge
          cargo +1.95.0 test --locked -p horizon-client-render --lib mesher::
          cargo +1.95.0 test --locked -p horizon-client-render --lib gfx::animate:: -- --test-threads=2
          cargo +1.95.0 test --locked -p horizon-client-render --lib mipmap::
          cargo +1.95.0 test --locked -p horizon-client-render --lib gfx::material_snapshot::
          python3 experiments/metal-prototype/tools/test_section_bridge.py
          cargo +1.95.0 fmt --manifest-path experiments/metal-prototype/Cargo.toml --check
          rustfmt +1.95.0 --check --edition 2024 --config skip_children=true crates/horizon-metal-bridge/src/runtime.rs crates/horizon-metal-bridge/src/lib.rs crates/horizon-client/src/game.rs crates/horizon-client/src/entry.rs crates/horizon-client-render/src/gfx/material_snapshot.rs crates/horizon-client-render/src/gfx/material_snapshot/tests.rs crates/horizon-client/src/game/remote.rs
          python3 tools/check_public_tree.py
          git diff --check
