name: Helium Metal Upload Validation
on:
  push:
    branches: [feature/helium-g05-metal-upload, feature/helium-g05-async-upload, feature/helium-g05-async-draw, feature/helium-g05-metal-presentation, feature/helium-g06-real-world-metal, feature/helium-g06-production-banks, feature/helium-g06-attached-game]
    paths:
      - 'crates/horizon-metal-bridge/**'
      - 'crates/horizon-client/src/game.rs'
      - 'packaging/ios/Launcher/**'
      - 'packaging/ios/project.yml'
      - 'packaging/ios/GameInfo.plist'
      - 'tools/ci/verify-attached-ios-game.py'
      - 'tests/test_attached_ios_binary.py'
      - 'crates/horizon-client/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'experiments/metal-prototype/src/**'
      - 'experiments/metal-prototype/ios/**'
      - 'experiments/metal-prototype/helium_metal_prototype.h'
      - 'experiments/metal-prototype/tools/**'
      - 'experiments/metal-prototype/examples/**'
      - 'experiments/metal-prototype/Cargo.toml'
      - 'experiments/metal-prototype/Cargo.lock'
      - '.github/workflows/helium-metal-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  apple-sdk:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record actual Apple tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helium-upload"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk macosx --show-sdk-version
          } 2>&1 | tee "$RUNNER_TEMP/helium-upload/toolchain.log"
      - name: Install pinned Rust and iOS target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: Compile and link experimental macOS tests
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/macos-tests.log"
      - name: Compile experimental iOS library and tests
        run: |
          set -euo pipefail
          cargo +1.95.0 check --locked --tests --target aarch64-apple-ios \
            --manifest-path experiments/metal-prototype/Cargo.toml \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/ios-check.log"
      - name: Compile existing G01 and G02 Metal shaders
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          {
            xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c \
              experiments/metal-prototype/src/terrain.metal -o "$RUNNER_TEMP/helium-upload/g01.air"
            xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c \
              experiments/metal-prototype/src/terrain/terrain24.metal -o "$RUNNER_TEMP/helium-upload/g02.air"
          } 2>&1 | tee "$RUNNER_TEMP/helium-upload/msl.log"
      - name: Compile banked terrain entry for iOS15
        run: |
          cat experiments/metal-prototype/src/terrain/terrain24.metal experiments/metal-prototype/src/terrain/terrain_banked.metal > "$RUNNER_TEMP/banked.metal"
          xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c "$RUNNER_TEMP/banked.metal" -o "$RUNNER_TEMP/helium-upload/banked.air"
      - name: Compile presentation shader and unsigned probe host
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos metal -target air64-apple-ios15.0 -std=ios-metal2.0 -c experiments/metal-prototype/src/terrain/metal/presentation.metal -o "$RUNNER_TEMP/helium-upload/display.air"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd experiments/metal-prototype/ios && xcodegen generate)
          xcodebuild -project experiments/metal-prototype/ios/HeliumMetalProbe.xcodeproj -scheme HeliumMetalProbe -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/helium-probe-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/helium-upload/swift-host.log" 2>&1
      - name: Probe native Metal uploads and original G01/G02 GPU regressions
        id: gpu
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path experiments/metal-prototype/Cargo.toml \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/helium-upload/native-runtime.log"
      - name: Report separate runtime outcome
        if: always()
        env:
          GPU_OUTCOME: ${{ steps.gpu.outcome }}
        run: |
          echo "Native Metal runtime step: $GPU_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Only a successful runtime test proves this runner executed Metal; SDK compilation alone does not." >> "$GITHUB_STEP_SUMMARY"
          echo "No app, IPA, signing, or packaging is performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish readable evidence through the Checks API
        if: always()
        uses: actions/github-script@v7
        env:
          GPU_OUTCOME: ${{ steps.gpu.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const names = ['toolchain.log', 'macos-tests.log', 'ios-check.log', 'msl.log', 'swift-host.log', 'native-runtime.log'];
            const sections = names.map(name => {
              const file = path.join(process.env.RUNNER_TEMP, 'helium-upload', name);
              const data = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'NOT RUN / no log';
              return '### ' + name + '\n\n```text\n' + data.slice(-8500) + '\n```';
            });
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Helium upload evidence', status: 'completed', conclusion: 'neutral',
              output: { title: 'Observed native-runtime step: ' + process.env.GPU_OUTCOME,
                summary: sections.join('\n\n') }
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helium-metal-upload-evidence
          path: ${{ runner.temp }}/helium-upload/*.log
          if-no-files-found: warn

  production-bridge:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '3'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: Check the actual game opt-in and iOS bridge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge"
          cargo +1.95.0 test --locked -p horizon-metal-bridge 2>&1 | tee "$RUNNER_TEMP/bridge/tests.log"
          HORIZON_SPRITE_SPLIT=512 cargo +1.95.0 test --locked -p horizon-metal-bridge --lib runtime::ownership_tests::native_worker_from_production_owned_bank_and_typed_section -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/bridge/native.log"
          cargo +1.95.0 check --locked -p horizon-client --no-default-features --features helium-direct-metal 2>&1 | tee "$RUNNER_TEMP/bridge/game.log"
          cargo +1.95.0 check --locked --target aarch64-apple-ios -p horizon-metal-bridge 2>&1 | tee "$RUNNER_TEMP/bridge/ios.log"
          cargo +1.95.0 check --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features helium-direct-metal 2>&1 | tee "$RUNNER_TEMP/bridge/ios-game.log"
      - name: Publish bridge compilation evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), path=require('path');
            const summary=['tests.log','native.log','game.log','ios.log','ios-game.log'].map(n=>{
              const p=path.join(process.env.RUNNER_TEMP,'bridge',n);
              return '### '+n+'\n```text\n'+(fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-10000):'NOT RUN')+'\n```';
            }).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'Helium production bridge evidence',status:'completed',conclusion:'neutral',output:{title:'Read individual compilation logs; not gameplay runtime proof',summary}});

  attached-ios-game:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
          mkdir -p "$RUNNER_TEMP/attached-game"
          xcodebuild -version | tee "$RUNNER_TEMP/attached-game/apple.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$RUNNER_TEMP/attached-game/apple.log"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helium-g06c-ios
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check default game and prove disabled dependency isolation
        run: |
          set -euo pipefail
          cargo +1.95.0 check --locked -p horizon-client --no-default-features 2>&1 | tee "$RUNNER_TEMP/attached-game/default.log"
          cargo +1.95.0 tree --locked -p horizon-client --no-default-features --target aarch64-apple-ios > "$RUNNER_TEMP/attached-game/default-tree.log"
          python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); assert "horizon-metal-bridge" not in s and "helium-metal-prototype" not in s; print("disabled graph excludes native bridge/backend")' "$RUNNER_TEMP/attached-game/default-tree.log" | tee "$RUNNER_TEMP/attached-game/dependency-isolation.log"
          python3 -m unittest discover -s tests -p test_attached_ios_binary.py 2>&1 | tee "$RUNNER_TEMP/attached-game/binary-guard-tests.log"
      - name: Actually link the opt-in arm64 Rust GAME executable
        run: |
          set -euo pipefail
          cargo +1.95.0 build --release --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features audio,helium-direct-metal 2>&1 | tee "$RUNNER_TEMP/attached-game/rust-link.log"
      - name: Compile and link the actual UIKit launcher and game bundle
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd packaging/ios && xcodegen generate)
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO DEBUG_INFORMATION_FORMAT=dwarf CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/attached-game/build" build > "$RUNNER_TEMP/attached-game/xcode.log" 2>&1 || { tail -80 "$RUNNER_TEMP/attached-game/xcode.log"; exit 1; }
          app="$RUNNER_TEMP/attached-game/build/HorizonGame.app"
          python3 tools/ci/verify-attached-ios-game.py "$app" target/aarch64-apple-ios/release/horizon-client 2>&1 | tee "$RUNNER_TEMP/attached-game/verified.log"
          mkdir -p "$RUNNER_TEMP/attached-game/package/Payload"
          cp -a "$app" "$RUNNER_TEMP/attached-game/package/Payload/"
          (cd "$RUNNER_TEMP/attached-game/package" && zip -qry ../Helium-G06C-game-unsigned.ipa Payload)
      - name: Publish actual game link evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const summary=['apple.log','default.log','dependency-isolation.log','binary-guard-tests.log','rust-link.log','xcode.log','verified.log'].map(n=>{
              const p=path.join(process.env.RUNNER_TEMP,'attached-game',n);
              return '### '+n+'\n```text\n'+(fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-7500):'NOT RUN')+'\n```';
            }).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'Helium attached GAME link evidence',status:'completed',conclusion:'neutral',output:{title:'Actual game link and Swift symbols; NOT device/world runtime evidence',summary}});
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Helium-G06C-isolated-game-unsigned
          path: ${{ runner.temp }}/attached-game/Helium-G06C-game-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helium-g06c-game-link-logs
          path: ${{ runner.temp }}/attached-game/*.log
