name: HeliumMetalProbe
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    SUPPORTED_PLATFORMS: iphoneos
    SDKROOT: iphoneos
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 13001
    HELIUM_DIAGNOSTIC_SHA: development-unidentified
    CODE_SIGN_STYLE: Automatic
    # Cargo needs its own target/cache directories; applies only to this test app.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HeliumMetalProbe:
    type: application
    platform: iOS
    sources:
      - path: ProbeApplication.swift
      - path: ../../../packaging/ios/Assets.xcassets
    dependencies:
      - target: HeliumProbeKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.helium.metalprobe
        INFOPLIST_FILE: ProbeInfo.plist
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/RustBridge
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
  HeliumProbeKit:
    type: framework
    platform: iOS
    sources:
      - path: MetalProbeApp.swift
      - path: ProbeRunner.swift
      - path: DisplayProbe.swift
      - path: ../../../packaging/ios/Launcher/HostEvidence.swift
    preBuildScripts:
      - name: Build experimental Rust static library
        shell: /bin/bash
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/build-rust.sh"'
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.helium.metalprobe.launcher
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/RustBridge
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../target/aarch64-apple-ios/release
        OTHER_LDFLAGS:
          - $(inherited)
          - -lhelium_metal_prototype
          - -liconv
          - -lSystem
          - -lobjc
schemes:
  HeliumMetalProbe:
    build:
      targets:
        HeliumMetalProbe: all
    run:
      config: Debug
      environmentVariables:
        MTL_DEBUG_LAYER: '1'
