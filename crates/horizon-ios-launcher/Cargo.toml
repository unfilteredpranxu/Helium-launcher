[package]
name = "horizon-ios-launcher"
version = "0.2.8"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Shows the SwiftUI launcher (packaging/ios/Launcher) over the game on iPhone and iPad"

[features]
host-qualification = ["dep:helium-metal-prototype", "dep:helium-render-scene", "dep:winit"]

[[bin]]
name = "helium-host-qualification"
path = "src/qualification/main.rs"
required-features = ["host-qualification"]

# Empty everywhere but iOS: the launcher is a Swift framework only an iOS bundle carries.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
log = "0.4"
helium-metal-prototype = { path = "../../experiments/metal-prototype", optional = true }
helium-render-scene = { path = "../helium-render-scene", optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.9.4"

[lints]
workspace = true
